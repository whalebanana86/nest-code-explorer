<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #d9dde3; --text: #1f2530; --muted: #6b7380; --soft: #eef1f5;
    --controller: #2f6fed; --worker: #d1495b; /* 라우트/cron 배지·진입점 verb 색 */
    --table: #8a5a1c; --ext: #444455;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; color: var(--text); background: var(--bg); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  header > * { flex: 0 0 auto; }
  header button { white-space: nowrap; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; white-space: nowrap; }
  .modes { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .modes button { border: 0; border-right: 1px solid var(--line); background: #fff; padding: 6px 12px; font: inherit; cursor: pointer; white-space: nowrap; }
  .modes button:last-child { border-right: 0; }
  .modes button.on { background: #1f2530; color: #fff; }
  .searchbox { position: relative; flex: 1 1 260px; max-width: 420px; min-width: 200px; }
  header input { width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  #results { position: absolute; top: 36px; left: 0; width: min(560px, calc(100vw - 40px)); max-height: 60vh; overflow: auto; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.12); z-index: 10; }
  #results .r { padding: 7px 10px; border-bottom: 1px solid var(--soft); cursor: pointer; font-size: 13px; }
  #results .r:hover, #results .r.active { background: #eef3ff; }
  #results .r .where { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  #results .r .where .cls { font-weight: 600; }
  #results .r .snip { color: var(--muted); font-size: 12px; margin-top: 1px; }
  #results .r mark { background: #ffe58a; padding: 0 1px; }
  #results .none { padding: 10px; color: var(--muted); font-size: 13px; }
  header button.plain { padding: 6px 10px; border: 1px solid var(--line); background: #fff; border-radius: 6px; font: inherit; cursor: pointer; }
  header button.plain:hover { background: var(--soft); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  main { display: grid; grid-template-columns: 300px 1fr 440px; grid-template-rows: 1fr; flex: 1 1 auto; min-height: 0; overflow: hidden; position: relative; }
  main.no-right { grid-template-columns: 300px 1fr; }
  main.no-left { grid-template-columns: 1fr 440px; }
  main.no-left.no-right { grid-template-columns: 1fr; }
  main.no-right aside { display: none; }
  main.no-left #entries { display: none !important; }
  #entries { display: block; border-right: 1px solid var(--line); background: var(--panel); overflow: auto; min-height: 0; }
  #entries .f { display: flex; gap: 8px; align-items: center; padding: 4px 12px; cursor: pointer; font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
  #entries .f:hover { background: var(--soft); }
  #entries .f input { margin: 0; }
  #entries .f .nm { flex: 1 1 auto; word-break: break-all; }
  #entries .f .cnt { color: var(--muted); font-size: 11px; }
  #entries .fbtns { display: flex; gap: 6px; padding: 8px 12px; }
  #entries .fbtns button { padding: 3px 8px; border: 1px solid var(--line); background: #fff; border-radius: 6px; font: inherit; font-size: 12px; cursor: pointer; }
  #entries .fbtns button:hover { background: var(--soft); }
  #toast { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); background: #1f2530; color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.2); z-index: 5; max-width: 560px; display: flex; gap: 12px; align-items: center; }
  #toast[hidden] { display: none; }
  #toast a { color: #9cc3ff; cursor: pointer; white-space: nowrap; }
  #toast .x { cursor: pointer; color: #9aa3b2; }
  header button.plain.on { background: #1f2530; color: #fff; border-color: #1f2530; }
  .panes { display: flex; gap: 4px; }
  .panes button { padding: 5px 8px; border: 1px solid var(--line); background: #fff; border-radius: 6px; font: inherit; font-size: 12px; cursor: pointer; color: var(--muted); }
  .panes button.on { background: var(--soft); color: var(--text); }
  .panes button:disabled { opacity: .4; cursor: default; }
  #entries h3 { font-size: 11px; margin: 14px 12px 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  #entries .opts { padding: 10px 12px 2px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--soft); }
  #entries .opts label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  #entries .e { display: flex; gap: 8px; align-items: baseline; padding: 5px 12px; cursor: pointer; font-size: 13px; border-left: 3px solid transparent; }
  #entries .e:hover { background: var(--soft); }
  #entries .e.on { background: #eef3ff; border-left-color: var(--controller); }
  #entries .e .verb { font-family: ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 700; width: 46px; flex: 0 0 auto; }
  #entries .e .path { font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; }
  #entries .e .sub { color: var(--muted); font-size: 11px; }
  #graphWrap { position: relative; min-height: 0; overflow: hidden; }
  #graph { background: var(--bg); height: 100%; min-height: 0; overflow: hidden; }
  #minimap { position: absolute; right: 12px; bottom: 12px; width: 260px; height: 180px; background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.08); cursor: pointer; z-index: 4; }
  #minimap[hidden] { display: none; }
  aside { border-left: 1px solid var(--line); background: var(--panel); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  aside .badge { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px; color: #fff; margin-right: 6px; vertical-align: 2px; }
  aside .file { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); word-break: break-all; }
  aside .file a { color: inherit; text-decoration: none; }
  aside .file a:hover { text-decoration: underline; }
  aside h3 { display: flex; align-items: center; gap: 6px; font-size: 11px; margin: 14px 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  aside h3 .n { background: var(--soft); color: var(--text); border-radius: 9px; padding: 0 7px; font-size: 11px; }
  aside h3 .toggle { margin-left: auto; font-size: 11px; text-transform: none; letter-spacing: 0; color: var(--controller); cursor: pointer; }
  .insp-head { padding: 12px 16px 0; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  .insp-head .type { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
  .insp-head h2 { font-size: 17px; margin: 1px 0 3px; word-break: break-all; }
  .insp-head .counts { font-size: 12px; color: var(--muted); margin: 6px 0 8px; }
  .insp-head .counts b { color: var(--text); font-weight: 600; }
  .tabs { display: flex; gap: 2px; }
  .tabs button { border: 0; background: none; padding: 6px 10px; font: inherit; font-size: 13px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }
  .tabs button .n { background: var(--soft); border-radius: 9px; padding: 0 6px; font-size: 11px; margin-left: 4px; }
  .insp-body { flex: 1 1 auto; overflow: auto; min-height: 0; padding: 4px 16px 16px; }
  .insp-body.flow { padding-top: 14px; }
  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li { display: flex; align-items: center; gap: 8px; padding: 4px 6px; margin: 0 -6px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .rows li:hover { background: var(--soft); }
  .rows li .dot { width: 8px; height: 8px; border-radius: 2px; flex: 0 0 auto; }
  .rows li .nm { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  .rows li .sub { color: var(--muted); font-size: 11.5px; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
  .msearch { width: 100%; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 13px; margin: 8px 0 6px; }
  .mlist { list-style: none; margin: 0; padding: 0; }
  .mlist li { display: grid; grid-template-columns: 1fr auto; column-gap: 8px; padding: 6px 6px; margin: 0 -6px; border-radius: 6px; cursor: pointer; border-bottom: 1px solid var(--soft); }
  .mlist li:hover { background: var(--soft); }
  .mlist li .nm { grid-column: 1; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; font-weight: 600; color: #111; }
  .mlist li .nm .kw { font-weight: 400; }
  .mlist li .chev { grid-column: 2; grid-row: 1 / span 3; align-self: center; color: var(--muted); }
  .mlist li .d { grid-column: 1; font-size: 12px; color: #3a4250; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mlist li .rt { grid-column: 1; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kw { font-size: 10px; padding: 0 5px; border-radius: 4px; background: var(--soft); color: var(--muted); white-space: nowrap; vertical-align: 1px; }
  .kw.route { background: #e6efff; color: var(--controller); font-family: ui-monospace, Menlo, monospace; }
  .kw.cron { background: #fff1f3; color: var(--worker); font-family: ui-monospace, Menlo, monospace; }
  .back { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--controller); cursor: pointer; margin: 4px 0 6px; }
  .back:hover { text-decoration: underline; }
  .mdet h2 { font-family: ui-monospace, Menlo, monospace; font-size: 16px; margin: 0 0 2px; word-break: break-all; }
  .mdet .desc { color: #3a4250; white-space: pre-wrap; font-size: 13px; margin: 4px 0 0; }
  .mdet .badges { margin: 6px 0 0; display: flex; gap: 4px; flex-wrap: wrap; }
  .kv { display: grid; grid-template-columns: minmax(90px, 40%) 1fr; row-gap: 3px; column-gap: 10px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .kv .k { color: #111; }
  .kv .v { color: var(--muted); word-break: break-all; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; }
  .calls-g { margin: 0 0 6px; }
  .calls-g .g { font-size: 12px; font-weight: 600; }
  .calls-g .g .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
  .calls-g ul { list-style: none; margin: 0; padding: 0 0 0 14px; }
  .calls-g li { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #3a4250; cursor: pointer; padding: 1px 0; }
  .calls-g li::before { content: '└ '; color: var(--muted); }
  .calls-g li:hover { text-decoration: underline; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  .chip:hover { background: var(--soft); }
  .chip.static { cursor: default; }
  .chip.err { border-color: #f1b9b9; background: #fff5f5; color: #8a1f1f; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
  .chip.tbl { border-color: #e2c9a8; background: #fdf6ec; color: var(--table); font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
  .chip.job { border-color: #f3c4cb; background: #fff1f3; color: var(--worker); font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
  .hint { color: var(--muted); font-size: 12px; }
  .trail { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-bottom: 6px; font-size: 12px; }
  .trail .crumb { padding: 1px 7px; border: 1.5px solid; border-radius: 10px; background: #fff; cursor: pointer; }
  .trail .crumb:last-child { font-weight: 600; }
  .trail .sep { color: var(--muted); }
  .empty { color: var(--muted); padding: 20px 16px; font-size: 13px; }
  .summary { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; background: #fbfcfd; font-size: 13px; }
  .summary .row { display: flex; gap: 8px; margin: 3px 0; align-items: baseline; }
  .summary .k { flex: 0 0 64px; color: var(--muted); font-size: 12px; }
  .steps { list-style: none; padding: 0; margin: 0; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .steps li { padding: 2px 0; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .steps li:hover { text-decoration: underline; }
  .steps li.on { font-weight: 700; }
  .steps li .lv { color: var(--muted); }
  @media (max-width: 1400px) { #modeHint { display: none; } }
  @media (max-width: 1200px) {
    main { grid-template-columns: 260px 1fr 380px; }
    main.no-right { grid-template-columns: 260px 1fr; }
    main.no-left { grid-template-columns: 1fr 380px; }
  }
  @media (max-width: 1000px) {
    .legend { display: none; }
    main { grid-template-columns: 240px 1fr 340px; }
    main.no-right { grid-template-columns: 240px 1fr; }
    main.no-left { grid-template-columns: 1fr 340px; }
  }
  @media (max-width: 760px) {
    main, main.no-left { grid-template-columns: 1fr 300px; }
    main.no-right, main.no-left.no-right { grid-template-columns: 1fr; }
    #entries { display: none !important; } /* 아주 좁으면 왼쪽 목록은 숨기고 그래프·상세만 */
  }
</style>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <div class="modes">
    <button id="modeStructure" class="on">구조</button>
    <button id="modeFlow">실행 경로</button>
  </div>
  <div class="searchbox">
    <input id="search" placeholder="검색: 클래스·메서드·설명·라우트·테이블·에러코드" autocomplete="off">
    <div id="results" hidden></div>
  </div>
  <button id="expandAll" class="plain">전부 펼치기</button>
  <button id="reset" class="plain">진입점만</button>
  <button id="focus" class="plain" title="고른 노드로 들어오는 것과 거기서 나가는 것만 남기고 나머지는 숨긴다">초점</button>
  <span class="hint" id="modeHint">클릭: 선택·펼치기 · 더블클릭: 접기 · 검은 테두리 = 지나온 경로 · 왼쪽: 폴더로 펼치기</span>
  <div class="panes">
    <button id="toggleLeft" class="on" title="왼쪽 목록 열기/닫기 (구조: 폴더 · 실행 경로: 진입점)">◧ 목록</button>
    <button id="toggleRight" class="on" title="오른쪽 상세 창 열기/닫기">상세 ◨</button>
  </div>
  <div class="legend" id="legend"></div>
</header>
<main id="main">
  <nav id="entries"></nav>
  <div id="graphWrap">
    <div id="graph"></div>
    <div id="toast" hidden></div>
    <canvas id="minimap" width="520" height="360" hidden title="전체 그래프 · 밝은 사각형이 지금 보는 영역. 누르거나 끌어서 이동"></canvas>
  </div>
  <aside id="panel"><div class="empty">노드를 클릭하면 주입받는 클래스가 펼쳐지고, 여기에 그 클래스의 메서드가 나온다. "실행 경로" 모드에서는 API 나 Job 하나가 지나가는 메서드 순서를 본다.</div></aside>
</main>
<script>__VIS__</script>
<script>
const DATA = __DATA__;
const byName = Object.fromEntries(DATA.classes.map((c) => [c.name, c]));
const methodOf = (cls, name) => byName[cls]?.methods.find((m) => m.name === name) ?? null;
// 계층(열·색·진입점 그룹)은 분석기 설정(code-explorer.config.json)에서 DATA.layers 로 넘어온다
const COL = Object.fromEntries(DATA.layers.map((l) => [l.name, l.column]));
const COL_GAP = 260, ROW_GAP = 56, GROUP_GAP = 90;
const COLOR = { ...Object.fromEntries(DATA.layers.map((l) => [l.name, l.color])), Table: '#8a5a1c', External: '#444455' };
const ENTRY_LAYERS = DATA.layers.filter((l) => l.entry); // 그래프 첫 화면에 놓는 계층 (순서 = 설정 순서)
const isEntryLayer = (name) => ENTRY_LAYERS.some((l) => l.name === name);
document.getElementById('legend').innerHTML = [...DATA.layers.filter((l) => DATA.classes.some((c) => c.layer === l.name)).map((l) => [l.name, l.color]), ['테이블', COLOR.Table], ['외부·큐', COLOR.External]]
  .map(([n, c]) => `<span><i style="background:${c}"></i>${n}</span>`).join('');
const BG = '#f6f7f9';
const METHOD_COLOR = { GET: '#1f7ed6', POST: '#23a36f', PUT: '#e0891a', PATCH: '#2bb8a3', DELETE: '#d63b3b', HEAD: '#6b7380', OPTIONS: '#6b7380' };
const verbColor = (kind, verb) => kind === 'http' ? (METHOD_COLOR[verb] ?? ENTRY_LAYERS[0]?.color ?? '#2f6fed') : (ENTRY_LAYERS[1]?.color ?? '#d1495b');
function mix(a, b, t) { const p = (h) => { if (h.length === 4) h = '#' + [...h.slice(1)].map((c) => c + c).join(''); return [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); }; const [x, y] = [p(a), p(b)]; return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
function esc(s) { return String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])); }
const entryRank = (layer) => ENTRY_LAYERS.findIndex((l) => l.name === layer);
const entries = DATA.classes
  .filter((c) => isEntryLayer(c.layer))
  .sort((a, b) => (a.layer === b.layer ? a.name.localeCompare(b.name) : entryRank(a.layer) - entryRank(b.layer)))
  .map((c) => c.name);

const nodes = new vis.DataSet();
const edges = new vis.DataSet();
const network = new vis.Network(document.getElementById('graph'), { nodes, edges }, {
  layout: { hierarchical: false }, physics: false,
  interaction: { hover: true, tooltipDelay: 150, dragNodes: true },
  nodes: { borderWidthSelected: 2 },
  edges: { smooth: { type: 'cubicBezier', forceDirection: 'horizontal', roundness: 0.4 }, arrows: { to: { scaleFactor: 0.7 } } },
});
let mode = 'structure';
let fitTimer = null;
const MIN_SCALE = 0.95; // 이보다 작아지면 노드 글자를 읽을 수 없으므로 전체 맞춤 대신 왼쪽 위부터 보여 주고 미니맵으로 나머지를 안내한다
const NODE_W = 170, NODE_H = 36; // 좌표는 노드 중심이므로 경계 계산에 더할 여유
const shownIds = () => nodes.get().filter((n) => !n.hidden).map((n) => n.id);
function bboxOf(ids) {
  const pos = network.getPositions(ids); const xs = [], ys = [];
  for (const id of ids) if (pos[id]) { xs.push(pos[id].x); ys.push(pos[id].y); }
  if (!xs.length) return null;
  return { minX: Math.min(...xs) - NODE_W / 2, maxX: Math.max(...xs) + NODE_W / 2, minY: Math.min(...ys) - NODE_H / 2, maxY: Math.max(...ys) + NODE_H / 2 };
}
const viewSize = () => { const el = document.getElementById('graph'); return { w: el.clientWidth, h: el.clientHeight }; };
/** 전체 맞춤. 다만 MIN_SCALE 아래로는 줄이지 않고 왼쪽 위 노드가 보이게 둔다 */
function fitAll() {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(() => {
    const ids = shownIds(); const b = bboxOf(ids); if (!b) return;
    const { w, h } = viewSize(); const pad = 30;
    let scale = Math.min(1.2, (w - pad * 2) / (b.maxX - b.minX), (h - pad * 2) / (b.maxY - b.minY));
    let position = { x: (b.minX + b.maxX) / 2, y: (b.minY + b.maxY) / 2 };
    if (scale < MIN_SCALE) {
      // 넘치는 축만 위/왼쪽 기준으로 두고, 화면에 들어가는 축은 가운데 둔다
      scale = MIN_SCALE;
      const fitsX = (b.maxX - b.minX) * scale <= w - pad * 2, fitsY = (b.maxY - b.minY) * scale <= h - pad * 2;
      position = { x: fitsX ? position.x : b.minX - pad + w / scale / 2, y: fitsY ? position.y : b.minY - pad + h / scale / 2 };
    }
    animatedMoveTo({ scale, position });
    setTimeout(drawMinimap, 300);

  const main = document.getElementById('main'); const graph = document.getElementById('graph');
  // 창을 열고 닫아도 노드가 화면에서 제자리에 있도록: 캔버스 중심의 화면 좌표가 움직인 만큼만 뷰 중심을 보정한다 (다시 맞추지 않음)
  const before = graph.getBoundingClientRect(); const scale = network.getScale(); const c = network.getViewPosition();
  main.classList.toggle('no-left', !panes.left);
  main.classList.toggle('no-right', !panes.right);
  document.getElementById('toggleLeft').classList.toggle('on', panes.left);
  document.getElementById('toggleRight').classList.toggle('on', panes.right);
  try { localStorage.setItem('explorer.panes', JSON.stringify(panes)); } catch {}
  const after = graph.getBoundingClientRect();
  network.setSize('100%', '100%'); // 캔버스를 지금 컨테이너 크기에 맞춘다 (px 로 고정하면 창 크기를 바꿀 때 캔버스가 안 늘어나 빈 영역에서 드래그가 안 된다)
  const dx = ((after.left + after.width / 2) - (before.left + before.width / 2)) / scale;
  // vis 는 캔버스 크기가 바뀌면 배율을 같이 바꾸므로 배율과 중심을 되돌린다
  if (before.width) network.moveTo({ scale, position: { x: c.x + dx, y: c.y }, animation: false });
  network.redraw(); drawMinimap();
}
document.getElementById('toggleLeft').addEventListener('click', () => { panes.left = !panes.left; applyPanes(); });
document.getElementById('toggleRight').addEventListener('click', () => { panes.right = !panes.right; applyPanes(); });
document.getElementById('modeStructure').addEventListener('click', () => setMode('structure'));
document.getElementById('modeFlow').addEventListener('click', () => setMode('flow'));
network.on('click', (p) => {
  const id = p.nodes[0];
  if (mode === 'flow') { if (id) selectFlowNode(id); else { flowSelected = null; flowRestyle(); showFlowSummary(); } return; }
  if (!id) { selected = null; trail = []; if (focus) { applyFocus(); relayout(); fitAll(); } else restyle(); return; }
  if (String(id).startsWith('__')) return;
  if (!expanded.has(id)) expand(id); // 이미 펼쳐진 노드는 그대로 두고 선택만 (접기는 더블클릭)
  showClass(id);
});
network.on('doubleClick', (p) => {
  const id = p.nodes[0];
  if (mode !== 'structure' || !id || String(id).startsWith('__') || !expanded.has(id)) return;
  collapse(id);
  showClass(id);
});
network.on('hoverNode', (p) => { if (!String(p.node).startsWith('__')) document.body.style.cursor = 'pointer'; });
network.on('blurNode', () => { document.body.style.cursor = 'default'; });
network.on('dragEnd', (p) => { if (mode !== 'structure') return; for (const id of p.nodes) { if (String(id).startsWith('__')) continue; manualPos.set(id, network.getPositions([id])[id]); } });
document.getElementById('expandAll').addEventListener('click', () => expandAll(false));
document.getElementById('reset').addEventListener('click', reset);
document.getElementById('focus').addEventListener('click', () => setFocus(!focus));

// ---- 검색: 클래스·메서드·설명·파라미터·호출 대상·파일·라우트·테이블·에러코드 ----
const INDEX = [];
for (const c of DATA.classes) {
  INDEX.push({ cls: c.name, method: null, text: `${c.name} ${c.layer} ${c.file} ${c.description} ${c.table ?? ''}`, snip: c.description || c.file });
  for (const m of c.methods)
    INDEX.push({ cls: c.name, method: m.name, text: `${c.name}.${m.name} ${m.params.join(' ')} ${m.returnType} ${m.description} ${m.calls.map((k) => `${k.cls}.${k.method}`).join(' ')} ${c.file} ${m.route ? `${m.route.method} ${m.route.path}` : ''} ${m.tables.join(' ')} ${m.errors.join(' ')} ${m.jobs.join(' ')} ${m.cron ?? ''}`,
      snip: m.route ? `${m.route.method} ${m.route.path} · ${m.description}` : m.description || `${c.file}:${m.line}` });
}
function search(q) { const words = q.toLowerCase().split(/\s+/).filter(Boolean); if (!words.length) return []; return INDEX.filter((it) => { const t = it.text.toLowerCase(); return words.every((w) => t.includes(w)); }).sort((a, b) => (a.method ? 1 : 0) - (b.method ? 1 : 0)).slice(0, 40); }
function hl(s, words) { let out = esc(s); for (const w of words) if (w) out = out.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), (m) => `<mark>${m}</mark>`); return out; }
const $s = document.getElementById('search'), $r = document.getElementById('results');
let hits = [], active = 0;
function renderResults() {
  const words = $s.value.toLowerCase().split(/\s+/).filter(Boolean);
  $r.hidden = !$s.value.trim(); if ($r.hidden) return;
  $r.innerHTML = hits.length ? hits.map((h, i) => `<div class="r ${i === active ? 'active' : ''}" data-i="${i}"><div class="where"><span class="cls" style="color:${COLOR[byName[h.cls].layer]}">${hl(h.cls, words)}</span>${h.method ? `.${hl(h.method, words)}()` : ''}</div><div class="snip">${hl(h.snip, words)}</div></div>`).join('') : '<div class="none">일치하는 항목 없음</div>';
  $r.querySelectorAll('.r').forEach((el) => el.addEventListener('mousedown', (e) => { e.preventDefault(); pick(Number(el.dataset.i)); }));
}
function pick(i) { const h = hits[i]; if (!h) return; goTo(h.cls, h.method ?? undefined); $r.hidden = true; $s.blur(); }
$s.addEventListener('input', () => { hits = search($s.value); active = 0; renderResults(); });
$s.addEventListener('focus', () => { if ($s.value.trim()) { hits = search($s.value); renderResults(); } });
$s.addEventListener('blur', () => setTimeout(() => { $r.hidden = true; }, 150));
$s.addEventListener('keydown', (e) => { if (e.key === 'ArrowDown') { active = Math.min(active + 1, hits.length - 1); renderResults(); e.preventDefault(); } else if (e.key === 'ArrowUp') { active = Math.max(active - 1, 0); renderResults(); e.preventDefault(); } else if (e.key === 'Enter') pick(active); else if (e.key === 'Escape') $r.hidden = true; });

reset();
applyPanes();
</script>
</body>
</html>
